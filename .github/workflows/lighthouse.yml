name: lighthouse

# Audits a production build served locally, not the deployed URL.
# Vercel's bot protection serves a Security Checkpoint page to CI runners,
# so auditing the live site measured the challenge page rather than the site.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Monday morning
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server never became reachable"
          exit 1

      # Thresholds come from real runs, not guesses (see
      # .github/lighthouserc.json). Accessibility and best-practices are
      # asserted at 100 and gate the job; SEO is a warning.
      #
      # Performance is asserted only on ?scene=off. With the scene running,
      # TBT and TTI measure a canvas that animates every frame rather than
      # this page, so a budget there would gate WebGL. ?scene=off is the same
      # page a phone actually gets — the scene is withheld and offered
      # instead — which makes it the honest thing to hold a budget against.
      - name: Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/work/silent-operator
            http://localhost:3000/?scene=off
          configPath: .github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
