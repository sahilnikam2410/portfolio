name: lighthouse

# Audits a production build served locally, not the deployed URL.
# Vercel's bot protection serves a Security Checkpoint page to CI runners,
# so auditing the live site measured the challenge page rather than the site.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Monday morning
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server never became reachable"
          exit 1

      # Report-only. The budget in .github/lighthouse-budget.json was written
      # from guesses and failed every run — a WebGL scene will not hold a
      # 400ms total-blocking-time budget on a shared CI runner. Read a few
      # real reports first, then set thresholds from those numbers and put
      # budgetPath back.
      - name: Audit
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/work/silent-operator
          uploadArtifacts: true
          temporaryPublicStorage: true
